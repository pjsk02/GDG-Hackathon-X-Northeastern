# Optional: Ollama in Docker, for machines without a native Ollama install.
# Behind a profile so a plain `docker compose up` never fights a native Ollama for port 11434.
#   make ollama-up      (= docker compose --profile docker-ollama up -d --wait)
services:
  ollama:
    image: ollama/ollama:0.40.16  # pinned to the native version this was verified with
    container_name: grounded_agent_ollama
    profiles: ["docker-ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  ollama_models:
